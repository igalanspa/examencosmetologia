/* ============ FECHAS / SEMANA / DÍA ============ */
function currentWeek(){const d=new Date();const j=new Date(d.getFullYear(),0,1);
  const days=Math.floor((d-j)/86400000);return Math.ceil((days+j.getDay()+1)/7);}
function dayOfYear(){const d=new Date();const s=new Date(d.getFullYear(),0,0);return Math.floor((d-s)/86400000);}
function dayKey(){const d=new Date();return d.getFullYear()*1000+dayOfYear();}
function dateStr(){const d=new Date();const dd=String(d.getDate()).padStart(2,'0');
  const mm=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()];return dd+'-'+mm;}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}

/* ============ ALEATORIEDAD SEMILLADA (mulberry32) ============ */
function rng(seed){seed=seed>>>0;return function(){seed=(seed+0x6D2B79F5)>>>0;let t=Math.imul(seed^(seed>>>15),1|seed);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function shuffle(arr,r){for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function prep(q,mid,ix,r){ // baraja alternativas
  const oi=q.o.map((_,k)=>k);shuffle(oi,r);
  return {q:q.q,o:oi.map(k=>q.o[k]),c:oi.indexOf(q.c),e:q.e,_ix:ix,mid:mid};}

/* ============ NOTA (escala 1-7, exigencia 75%) ============ */
function nota(p){let n=p>=75?4+(p-75)/25*3:1+(p/75)*3;return Math.round(n*10)/10;}
function notaColor(n){return n>=6?'var(--ok)':n>=4?'var(--warn)':'var(--bad)';}
function pctColor(p){return p>=75?'var(--ok)':p>=50?'var(--warn)':'var(--bad)';}

/* ============ MÓDULOS Y TEORÍA ============ */
const MODULES=[
{id:"norm",icon:"⚖️",name:"Normativa (Decreto 88)",theory:`
<p>El ejercicio de la cosmetología en Chile se rige por el <strong>Decreto 88 de 1980</strong> del Ministerio de Salud, que aprueba el "Reglamento para ejercer las actividades de cosmetología". Es la base legal del examen y da puntos seguros porque es memorizable.</p>
<h3>¿Qué es un cosmetólogo?</h3><p>Persona autorizada para el <strong>embellecimiento, modificación del aspecto físico o conservación de las condiciones físico-químicas normales de la piel y sus anexos</strong>. Trabaja sobre <strong>piel sana</strong>, con fines estéticos, NO terapéuticos.</p>
<h3>Requisitos para la autorización</h3><ul><li>Idoneidad moral.</li><li>Edad entre <strong>18 y 60 años</strong>.</li><li>Salud compatible con la profesión.</li><li><strong>Cuarto año de enseñanza media</strong> (o equivalente).</li><li>Aprobar el <strong>examen de competencia</strong> ante la autoridad sanitaria.</li></ul>
<h3>La comisión examinadora</h3><p>La integran el <strong>Director del Servicio de Salud</strong> (preside), el <strong>Jefe de Registro de Profesiones Médicas</strong> y un <strong>médico cirujano, preferentemente dermatólogo</strong>.</p>
<h3>Lo que SÍ puede hacer</h3><ul><li>Higiene y embellecimiento de piel sana (limpieza de cutis, maquillaje, masaje estético).</li><li>Usar cosméticos <strong>registrados</strong>.</li><li>Trabajar en institutos de belleza y establecimientos autorizados.</li></ul>
<h3>Lo que NO puede hacer</h3><ul><li>Atender <strong>enfermedades de la piel</strong>.</li><li>Dar <strong>indicaciones terapéuticas</strong> o diagnósticos.</li><li>Usar o recomendar <strong>fármacos de uso médico</strong>.</li><li>Usar productos no registrados.</li></ul>
<div class="key">🔑 <b>Regla de oro:</b> ante cualquier signo de enfermedad (lesión sospechosa, infección, herpes, verrugas) → <b>no intervenir y derivar al médico</b>. Las infracciones pueden llegar hasta la <b>cancelación de la autorización</b>.</div>
<div class="key">📋 <b>Datos del examen:</b> 70 preguntas de alternativas · presencial y contra reloj · aprobación <b>75%</b> (53/70) · postulación online todo el año · máximo <b>3 intentos</b>.</div>`},
{id:"anat",icon:"🔬",name:"Anatomía y fisiología de la piel",theory:`
<p>Es el área con más preguntas. La piel es el <strong>órgano más extenso</strong> del cuerpo y tiene tres capas: <strong>epidermis, dermis e hipodermis</strong> (de superficial a profunda).</p>
<h3>1. Epidermis (externa)</h3><p>No tiene vasos sanguíneos. Estratos de profundo a superficial: <strong>basal (germinativo) → espinoso → granuloso → lúcido → córneo</strong>. El <strong>lúcido</strong> solo existe en piel gruesa (palmas y plantas).</p>
<ul><li><strong>Basal:</strong> aquí ocurre la <strong>mitosis</strong> que renueva la piel.</li><li><strong>Córneo:</strong> capa más superficial, de células muertas queratinizadas (corneocitos).</li></ul>
<p>Células: <strong>queratinocitos</strong> (queratina), <strong>melanocitos</strong> (melanina, protege del UV) y <strong>Langerhans</strong> (defensa inmune).</p>
<h3>2. Dermis (media)</h3><p>Contiene <strong>fibroblastos</strong>, que producen <strong>colágeno</strong> (firmeza) y <strong>elastina</strong> (elasticidad). Aquí están vasos, nervios, glándulas y folículos.</p>
<h3>3. Hipodermis (subcutáneo)</h3><p>Formada por <strong>tejido adiposo (grasa)</strong>: reserva energética, aislante y amortiguación.</p>
<h3>Anexos y glándulas</h3><ul><li><strong>Anexos:</strong> pelos, uñas y glándulas.</li><li><strong>Sebáceas:</strong> producen <strong>sebo</strong> (lubrica).</li><li><strong>Sudoríparas</strong> (ecrinas y apocrinas): producen <strong>sudor</strong>.</li></ul>
<div class="key">🔑 <b>Memoriza:</b> pH cutáneo ≈ <b>4,5–5,5</b> (manto ácido) · renovación (turnover) ≈ <b>28 días</b> · funciones: protección, termorregulación, tacto y síntesis de <b>vitamina D</b>.</div>`},
{id:"alt",icon:"🩺",name:"Alteraciones dérmicas",theory:`
<p>Debes reconocer las alteraciones comunes y, sobre todo, saber <strong>cuáles son de manejo médico</strong> (para derivar).</p>
<h3>Lesiones elementales</h3><ul><li><strong>Mácula:</strong> mancha plana, solo color, sin relieve (ej. peca).</li><li><strong>Pápula:</strong> elevación sólida &lt;1 cm.</li><li><strong>Vesícula:</strong> elevación con <strong>líquido claro</strong>.</li><li><strong>Pústula:</strong> elevación con <strong>pus</strong>.</li><li><strong>Roncha:</strong> elevación transitoria (urticaria).</li></ul>
<h3>Alteraciones frecuentes</h3><ul><li><strong>Acné:</strong> hiperseborrea + obstrucción folicular. Comedón <strong>abierto</strong>=punto negro; <strong>cerrado</strong>=punto blanco.</li><li><strong>Melasma/cloasma:</strong> hiperpigmentación (manchas), ligada a sol y hormonas.</li><li><strong>Rosácea:</strong> enrojecimiento + telangiectasias; piel sensible, evitar irritantes/calor, derivar.</li><li><strong>Couperosis:</strong> capilares dilatados y frágiles en el rostro.</li><li><strong>Estrías:</strong> ruptura de colágeno/elastina por estiramiento rápido.</li><li><strong>Deshidratación:</strong> falta de <strong>agua</strong> (no de grasa); tirantez y descamación fina.</li></ul>
<h3>Envejecimiento</h3><p><strong>Cronoenvejecimiento</strong>=propio de la edad; <strong>fotoenvejecimiento</strong>=daño por radiación UV.</p>
<div class="key">🔑 <b>Siempre derivar (origen médico):</b> herpes (viral), verrugas (VPH), infecciones bacterianas, micosis (hongos), lunares que cambian. El cosmetólogo <b>no trata enfermedades</b>.</div>
<h3>Tipos de piel</h3><p><strong>Grasa:</strong> brillo, poros, comedones. <strong>Seca:</strong> falta de sebo. <strong>Mixta:</strong> zona T grasa y mejillas secas. <strong>Sensible:</strong> reacciona con facilidad.</p>`},
{id:"cosm",icon:"🧴",name:"Cosméticos y activos",theory:`
<p>Un <strong>cosmético</strong> se aplica en la superficie corporal para <strong>limpiar, perfumar, embellecer o proteger</strong>, <strong>sin acción terapéutica</strong>. Su control sanitario en Chile lo lleva el <strong>ISP</strong>.</p>
<h3>Composición de una emulsión</h3><ul><li><strong>Fase acuosa</strong> (agua) + <strong>fase oleosa</strong> (aceites).</li><li><strong>Emulsionante:</strong> une y estabiliza ambas fases.</li><li><strong>Conservantes:</strong> evitan contaminación microbiana.</li></ul>
<h3>Activos clave</h3><ul><li><strong>Ácido hialurónico:</strong> hidratante, retiene agua.</li><li><strong>AHA</strong> (glicólico): exfoliantes químicos.</li><li><strong>Vitamina C:</strong> antioxidante, luminosidad.</li><li><strong>Retinol (vit. A):</strong> renovador; fotosensibilizante → de <strong>noche</strong> + protector de día.</li><li><strong>Niacinamida (B3):</strong> calma, controla sebo, ilumina.</li><li><strong>FPS:</strong> prolonga la protección frente al eritema (UVB); reaplicar cada 2 h. <strong>UVA</strong>=envejecimiento, <strong>UVB</strong>=quemadura.</li></ul>
<div class="key">🔑 <b>Seguridad:</b> antes de un producto nuevo, <b>test de parche</b>. Nunca usar cosméticos vencidos ni no registrados. El símbolo PAO indica los meses de uso tras abrir.</div>`},
{id:"asep",icon:"🧼",name:"Asepsia y antisepsia",theory:`
<p>La bioseguridad protege al cliente y a ti. Distingue tres conceptos:</p>
<ul><li><strong>Asepsia:</strong> medidas para <strong>prevenir</strong> la llegada de microbios.</li><li><strong>Antisepsia:</strong> <strong>eliminar</strong> microbios sobre <strong>tejidos vivos</strong> (piel).</li><li><strong>Esterilización:</strong> eliminar <strong>toda</strong> vida microbiana, <strong>incluidas esporas</strong>.</li></ul>
<h3>Métodos y productos</h3><ul><li><strong>Autoclave</strong> (vapor a presión): estándar para instrumental metálico.</li><li><strong>Antisépticos de piel:</strong> alcohol <strong>70%</strong>, clorhexidina.</li><li><strong>Desinfección de superficies</strong> entre cada cliente.</li></ul>
<h3>Prácticas obligatorias</h3><ul><li><strong>Lavado de manos:</strong> primera y más efectiva medida, antes y después de cada atención.</li><li><strong>EPP:</strong> guantes, mascarilla y delantal. Los guantes son de un solo uso y NO reemplazan el lavado de manos.</li><li><strong>Cortopunzantes:</strong> a <strong>contenedor rígido</strong> rotulado.</li></ul>
<div class="key">🔑 <b>Secuencia correcta:</b> limpieza → desinfección → esterilización. <b>Contaminación cruzada</b> = paso de microbios de una fuente contaminada a algo limpio; prevenirla es el corazón de la higiene en cabina.</div>`},
{id:"func",icon:"✋",name:"Funciones y procedimientos",theory:`
<p>Antes de cualquier tratamiento: <strong>ficha del cliente + diagnóstico cutáneo</strong> (con piel limpia y buena luz). Así personalizas y detectas contraindicaciones.</p>
<h3>Protocolo de limpieza facial</h3><ol><li><strong>Desmaquillar / limpiar.</strong></li><li><strong>Exfoliar</strong> según el tipo de piel.</li><li><strong>Extraer</strong> comedones si corresponde (con asepsia).</li><li><strong>Tonificar</strong> (restaura pH, retira restos).</li><li><strong>Hidratar / mascarilla.</strong></li><li><strong>Proteger:</strong> de día, siempre <strong>protección solar</strong> al final.</li></ol>
<h3>Elementos</h3><ul><li><strong>Tónico:</strong> completa la limpieza y reequilibra el pH.</li><li><strong>Vaporizador/ozono:</strong> ablanda comedones y facilita la limpieza.</li><li><strong>Masaje estético:</strong> estimula circulación, relaja y ayuda a la penetración de activos (no cura enfermedades).</li></ul>

/* ============ HELPERS DE POOL ============ */
function allQ(){const a=[];MODULES.forEach(m=>QUESTIONS[m.id].forEach((q,ix)=>a.push({q,mid:m.id,ix})));return a;}
function weeklyModuleQuiz(id){
  const pool=QUESTIONS[id];const n=Math.min(12,pool.length);
  const r=rng(currentWeek()*7919+hashStr(id));
  const idx=pool.map((_,i)=>i);shuffle(idx,r);
  return idx.slice(0,n).map(i=>prep(pool[i],id,i,r));
}
function dailyQuiz(){
  const all=allQ();const n=Math.min(18,all.length);
  const r=rng(dayKey()*104729+7);
  const idx=all.map((_,i)=>i);shuffle(idx,r);
  return idx.slice(0,n).map(i=>prep(all[i].q,all[i].mid,all[i].ix,r));
}
function simQuiz(){ // 70 aleatorias, distintas cada vez
  const all=allQ();const n=Math.min(70,all.length);
  const r=rng((dayKey()*13+DB.hist.length*997+Math.floor(performance.now()))>>>0);
  const idx=all.map((_,i)=>i);shuffle(idx,r);
  return idx.slice(0,n).map(i=>prep(all[i].q,all[i].mid,all[i].ix,r));
}

/* ============ ESTADO GLOBAL ============ */
function overallNota(){const ns=MODULES.map(m=>DB.best[m.id]?DB.best[m.id].nota:null).filter(x=>x!==null);
  if(!ns.length)return null;return Math.round(ns.reduce((a,b)=>a+b,0)/ns.length*10)/10;}
function readiness(){return Math.round(MODULES.reduce((s,m)=>s+(DB.best[m.id]?DB.best[m.id].pct:0),0)/MODULES.length);}
function contentsDone(){return MODULES.every(m=>DB.best[m.id]);}
function dailyStreak(){
  const keys=Object.keys(DB.daily).map(Number).sort((a,b)=>b-a);
  if(!keys.length)return 0;let streak=0;let expect=dayKey();
  // permite que hoy aún no esté hecho
  if(keys[0]!==expect)expect=keys[0];
  for(const k of keys){if(k===expect){streak++;expect=expect-1;}else if(k<expect){break;}}
  return streak;
}
function todayDone(){return !!DB.daily[dayKey()];}
/* ---- Análisis de avance y refuerzo ---- */
function moduleAttempts(id){return DB.hist.filter(r=>r.mod===id);}
function moduleTrend(id){const a=moduleAttempts(id);if(a.length<2)return null;return a[a.length-1].pct-a[a.length-2].pct;}
function trendTag(id){const t=moduleTrend(id);if(t===null)return '';
  if(t>0)return ' <span style="color:var(--ok);font-size:.8rem">▲ +'+t+'</span>';
  if(t<0)return ' <span style="color:var(--bad);font-size:.8rem">▼ '+t+'</span>';
  return ' <span class="note" style="font-size:.8rem">→ igual</span>';}
function reinforcePlan(){
  const areas=MODULES.map(m=>({m,best:DB.best[m.id]?DB.best[m.id].pct:0,rendido:!!DB.best[m.id]}));
  const pend=areas.filter(a=>!a.rendido);
  const low=areas.filter(a=>a.rendido&&a.best<85).sort((x,y)=>x.best-y.best);
  const plan=[];
  pend.forEach(a=>plan.push({id:a.m.id,icon:a.m.icon,name:a.m.name,pct:null,pri:'Pendiente',action:'Estudia el contenido y rinde su prueba semanal.'}));
  low.forEach(a=>plan.push({id:a.m.id,icon:a.m.icon,name:a.m.name,pct:a.best,pri:a.best<75?'Urgente':'Afinar',
    action:a.best<75?'Bajo aprobación: repasa la teoría y tu Refuerzo, luego vuelve a rendir.':'Casi listo: repasa tus errores en Refuerzo para superar el 85%.'}));
  return plan;
}

/* ============ MOTOR DE QUIZ (módulo / diario / simulacro) ============ */
let quiz={mode:null,id:null,list:[],i:0,ans:[],t:0,timer:null};
function startQuiz(id){if(licExpired())return renderLocked();quiz={mode:'mod',id,list:weeklyModuleQuiz(id),i:0,ans:new Array(weeklyModuleQuiz(id).length).fill(null),t:0,timer:null};
  // regenerar list una sola vez (misma semana da mismo set)
  quiz.list=weeklyModuleQuiz(id);quiz.ans=new Array(quiz.list.length).fill(null);renderQuiz();}
function startDaily(){if(licExpired())return renderLocked();const l=dailyQuiz();quiz={mode:'daily',id:'daily',list:l,i:0,ans:new Array(l.length).fill(null),t:0,timer:null};renderQuiz();}
function startSim(){if(licExpired())return renderLocked();const l=simQuiz();quiz={mode:'sim',id:'sim',list:l,i:0,ans:new Array(l.length).fill(null),t:90*60,timer:null};
  quiz.timer=setInterval(()=>{quiz.t--;const el=document.getElementById('qtimer');
    if(el)el.textContent=String(Math.floor(quiz.t/60)).padStart(2,'0')+':'+String(quiz.t%60).padStart(2,'0');
    if(quiz.t<=0){clearInterval(quiz.timer);finishQuiz();}},1000);renderQuiz();}
function renderQuiz(){
  const q=quiz.list[quiz.i];
  let title=quiz.mode==='mod'?MODULES.find(x=>x.id===quiz.id).icon+' '+MODULES.find(x=>x.id===quiz.id).name
    :quiz.mode==='daily'?'📅 Reto del día ('+dateStr()+')':'🏁 Simulacro final';
  const right=quiz.mode==='sim'?`<span id="qtimer" style="font-weight:700">90:00</span>`:`Pregunta ${quiz.i+1}/${quiz.list.length}`;
  document.getElementById('view').innerHTML=`<div class="card">
    <div class="barq"><span>${title}</span><span>${right}</span></div>
    ${quiz.mode==='sim'?`<div class="note" style="margin-bottom:8px">Pregunta ${quiz.i+1}/${quiz.list.length}</div>`:''}
    <div style="font-weight:600;font-size:1.05rem;margin-bottom:14px">${q.q}</div>
    ${q.o.map((o,i)=>`<label class="opt ${quiz.ans[quiz.i]===i?'sel':''}" onclick="pickQ(${i})">${String.fromCharCode(65+i)}) ${o}</label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn sec" style="flex:1" onclick="prevQ()">◀</button>
      <button class="btn" style="flex:1" onclick="nextQ()">${quiz.i===quiz.list.length-1?'Corregir ✓':'Siguiente ▶'}</button></div>
    ${quiz.mode==='sim'?'<button class="btn sec sm full" style="margin-top:8px" onclick="finishQuiz()">Terminar y corregir ahora</button>':''}
  </div>`;}
function pickQ(i){quiz.ans[quiz.i]=i;renderQuiz();}
function prevQ(){if(quiz.i>0){quiz.i--;renderQuiz();}}
function nextQ(){if(quiz.i<quiz.list.length-1){quiz.i++;renderQuiz();}else finishQuiz();}
function finishQuiz(){
  if(quiz.timer)clearInterval(quiz.timer);
  let correct=0;const wrongByMod={};const byArea={};MODULES.forEach(m=>byArea[m.id]={ok:0,total:0});
  quiz.list.forEach((q,i)=>{
    if(byArea[q.mid])byArea[q.mid].total++;
    if(quiz.ans[i]===q.c){correct++;if(byArea[q.mid])byArea[q.mid].ok++;}
    else{(wrongByMod[q.mid]=wrongByMod[q.mid]||[]).push(q._ix);}
  });
  const total=quiz.list.length;const pct=Math.round(correct/total*100);const n=nota(pct);const passed=pct>=75;
  // guardar
  const label=quiz.mode==='mod'?MODULES.find(x=>x.id===quiz.id).name:quiz.mode==='daily'?'📅 Reto del día':'★ Simulacro final';
  DB.hist.push({mod:quiz.id,modName:label,pct,nota:n,correct,total,date:dateStr()});
  if(quiz.mode==='mod'){if(!DB.best[quiz.id]||pct>DB.best[quiz.id].pct)DB.best[quiz.id]={pct,nota:n};DB.wrong[quiz.id]=wrongByMod[quiz.id]||[];}
  if(quiz.mode==='daily'){DB.daily[dayKey()]={pct,nota:n};Object.keys(wrongByMod).forEach(mid=>DB.wrong[mid]=wrongByMod[mid]);}
  if(quiz.mode==='sim'){Object.keys(wrongByMod).forEach(mid=>DB.wrong[mid]=wrongByMod[mid]);}
  save();
  const areaHtml=(quiz.mode!=='mod')?`<div class="card"><h2>📊 Desglose por área</h2>
    ${MODULES.map(m=>{const a=byArea[m.id];if(!a.total)return '';const p=Math.round(a.ok/a.total*100);
      return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:.9rem"><span>${m.icon} ${m.name}</span><span>${a.ok}/${a.total} · ${p}%</span></div>
      <div class="track"><div class="fill" style="width:${p}%;background:${pctColor(p)}"></div></div></div>`;}).join('')}</div>`:'';
  document.getElementById('view').innerHTML=`
  <div class="card center">
    <div class="badge ${passed?'b-ok':'b-bad'}" style="font-size:.95rem;padding:7px 16px">${passed?'✅ APROBADO':'📚 A REFORZAR'}</div>
    <div class="big" style="color:${notaColor(n)};margin:8px 0">${n.toFixed(1)}</div>
    <p class="note">${correct}/${total} correctas · ${pct}% · aprobación 4,0 (75%)</p>
    ${quiz.mode==='daily'&&dailyStreak()?`<div class="streak">🔥 Racha: ${dailyStreak()} días seguidos</div>`:''}
  </div>
  ${areaHtml}
  <div class="card"><h2>📝 Revisión y refuerzo</h2>
    ${quiz.list.map((q,i)=>{const ok=quiz.ans[i]===q.c;
      return `<div style="border-bottom:1px solid var(--line);padding:12px 0">
        <div style="display:flex;justify-content:space-between;gap:8px"><strong>${i+1}. ${q.q}</strong><span class="badge ${ok?'b-ok':'b-bad'}">${ok?'✓':'✗'}</span></div>
        <div style="margin:6px 0;font-size:.9rem">${quiz.ans[i]!==null?'Tu respuesta: <span style="color:'+(ok?'var(--ok)':'var(--bad)')+'">'+String.fromCharCode(65+quiz.ans[i])+') '+q.o[quiz.ans[i]]+'</span>':'<span class="note">Sin responder</span>'}
        ${!ok?'<br>Correcta: <span style="color:var(--ok)">'+String.fromCharCode(65+q.c)+') '+q.o[q.c]+'</span>':''}</div>
        ${!ok?'<div class="expl">💡 '+q.e+'</div>':''}</div>`;}).join('')}
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn sec" style="flex:1" onclick="go('home')">Inicio</button>
      <button class="btn" style="flex:1" onclick="go('reinf')">Ver refuerzo</button></div></div>`;
  window.scrollTo(0,0);
}

        <div style="font-weight:600;margin:10px 0">${it.q.q}</div>
        <div style="color:var(--ok);font-size:.92rem">✔ Correcta: ${it.q.o[it.q.c]}</div>
        <div class="expl">💡 ${it.q.e}</div></div>`;}).join('')}`;
}

/* ============ HISTORIAL ============ */
function renderHist(){
  const h=DB.hist;let trend='';
  if(h.length>=2){const d=h[h.length-1].pct-h[0].pct;
    trend=d>0?`📈 Progreso: +${d} puntos desde tu primera prueba.`:d<0?`📉 Bajaste ${Math.abs(d)} puntos; usa el refuerzo.`:`➡️ Estable; ataca tus áreas más bajas.`;}
  const weak=MODULES.map(m=>({name:m.name,icon:m.icon,pct:DB.best[m.id]?DB.best[m.id].pct:0})).sort((a,b)=>a.pct-b.pct)[0];
  document.getElementById('view').innerHTML=`
  <div class="card"><h2>📈 Progreso y evolución</h2>
    ${h.length?`<p class="note">${trend}</p><div style="margin:8px 0"><strong>🎯 A mejorar ahora:</strong> ${weak.icon} ${weak.name} (${weak.pct}%)</div>`:'<p class="note">Aún no hay pruebas registradas.</p>'}
    <button class="btn gold full" style="margin-top:8px" onclick="renderValidation()">🎓 Validar mi aprendizaje</button>
  </div>
  ${h.length?`<div class="card"><table><thead><tr><th>#</th><th>Fecha</th><th>Evaluación</th><th>Nota</th><th>%</th></tr></thead>
    <tbody>${h.slice().reverse().map((r,i)=>`<tr><td>${h.length-i}</td><td>${r.date}</td><td style="font-size:.8rem">${r.modName}</td>
      <td><span class="nota" style="color:${notaColor(r.nota)}">${r.nota.toFixed(1)}</span></td><td>${r.pct}%</td></tr>`).join('')}</tbody></table>
    <button class="btn sec sm" style="margin-top:14px" onclick="if(confirm('¿Borrar todo tu historial y avance?')){DB={hist:[],wrong:{},studied:{},best:{},daily:{},examIntent:false};save();renderHist();}">🗑️ Borrar historial</button></div>`:''}`;
}

/* ============ VALIDACIÓN DE APRENDIZAJE ============ */
function renderValidation(){
  DB.examIntent=true;save();
  const n=overallNota();const r=readiness();
  const areas=MODULES.map(m=>({m,pct:DB.best[m.id]?DB.best[m.id].pct:0,rendido:!!DB.best[m.id]}));
  const sinRendir=areas.filter(a=>!a.rendido);
  const bajo85=areas.filter(a=>a.rendido&&a.pct<85);
  const bajo75=areas.filter(a=>a.rendido&&a.pct<75);
  let verdict,vc,rec;
  if(sinRendir.length){verdict="Falta completar contenidos";vc="var(--warn)";rec="Rinde primero las áreas pendientes: "+sinRendir.map(a=>a.m.name).join(', ')+".";}
  else if(n>=6&&bajo85.length===0){verdict="🌟 ¡Listа para la excelencia!";vc="var(--ok)";rec="Todas tus áreas superan el 85%. Mantén el Reto del día y agenda tu examen con confianza.";}
  else if(bajo75.length===0){verdict="✅ Aprobarías, sigue afinando";vc="var(--warn)";rec="Superas el 75% en todo. Para ir segura a la excelencia, sube estas áreas sobre 85%: "+(bajo85.map(a=>a.m.name).join(', ')||'—')+".";}
  else{verdict="📚 Aún no estás lista";vc="var(--bad)";rec="Refuerza estas áreas bajo el 75% antes de rendir: "+bajo75.map(a=>a.m.name+' ('+a.pct+'%)').join(', ')+".";}
  const dailies=Object.keys(DB.daily).length;
  const dailyAvg=dailies?Math.round(Object.values(DB.daily).reduce((s,v)=>s+v.pct,0)/dailies):0;
  document.getElementById('view').innerHTML=`
  <div class="card center">
    <div class="note">Validación de tu aprendizaje</div>
    <div class="big" style="color:${vc}">${n!==null?n.toFixed(1):'—'}</div>
    <div class="badge" style="background:#141834;color:${vc};font-size:.95rem;padding:7px 16px">${verdict}</div>
    <div class="grid" style="margin-top:12px">
      <div class="stat"><div class="n" style="color:${pctColor(r)}">${r}%</div><div class="l">Preparación global</div></div>
      <div class="stat"><div class="n">${dailies}</div><div class="l">Retos diarios hechos</div></div>
      <div class="stat"><div class="n">🔥 ${dailyStreak()}</div><div class="l">Racha actual</div></div>
    </div>
  </div>
  <div class="card"><h2>📋 Diagnóstico por área</h2>
    ${areas.map(a=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:.9rem">
      <span>${a.m.icon} ${a.m.name}</span><span>${a.rendido?a.pct+'% '+(a.pct>=85?'🌟':a.pct>=75?'✅':'⚠️'):'<span class="note">sin rendir</span>'}</span></div>
      <div class="track"><div class="fill" style="width:${a.pct}%;background:${pctColor(a.pct)}"></div></div></div>`).join('')}
    <div class="key" style="margin-top:14px">🎓 <b>Recomendación:</b> ${rec}</div>
    <p class="note">Regla del examen real: necesitas <strong>75%</strong> para aprobar; apunta a <strong>85%+</strong> por área para rendir con holgura.</p>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn sec" style="flex:1" onclick="go('reinf')">🎯 Ir a refuerzo</button>
      <button class="btn" style="flex:1" onclick="startSim()">🏁 Simulacro final</button></div>
  </div>`;
  window.scrollTo(0,0);
}

go('home');
</script>
</body>
</html>
